name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo môi trường Java 17 chuẩn
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 2: Ép máy chủ GitHub tải và cài đặt chính xác phiên bản Gradle 8.5 để tương thích với code Gemini
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # Bước 3: Tự động bù đắp tệp thực thi gradlew đồng bộ vào thư mục app
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      working-directory: app

    # Bước 4: Khóa quyền thực thi bảo mật cho tệp hệ thống vừa sinh ra
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: app

    # Bước 5: Tiến hành đóng gói file APK thành phẩm từ thư mục con
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      working-directory: app

    # Bước 6: Xuất file APK ra ngoài màn hình để tải về máy tính
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/app/build/outputs/apk/debug/app-debug.apk
