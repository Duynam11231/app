name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 2: Khởi tạo Gradle 8.5 đồng bộ cấu trúc với Gemini
    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    # Bước 3: Tạo tệp gradlew thực thi hệ thống
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      working-directory: app

    # Bước 4: Khóa quyền bảo mật cho tệp vừa sinh ra
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: app

    # Bước 5: Đóng gói file debug APK (Sửa đường dẫn chính xác)
    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace
      working-directory: app

    # Bước 6: Xuất file APK ra màn hình để tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/app/build/outputs/apk/debug/app-debug.apk
