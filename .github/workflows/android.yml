name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Cài đặt Java 17 tương thích với cấu hình kts của Gemini
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # Sửa quyền chạy bắt buộc cho tệp gradlew nằm sâu bên trong thư mục app
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: app

    # Ép lệnh build chạy trực tiếp từ bên trong thư mục con "app"
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      working-directory: app

    # Xuất file APK thành phẩm ra màn hình để tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/app/build/outputs/apk/debug/app-debug.apk
