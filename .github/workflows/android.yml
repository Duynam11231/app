name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo môi trường Java 21 chuẩn
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Bước 2: Khởi tạo trình Gradle 9.3.1 kịch trần
    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Bước 3: Đóng gói trực tiếp (Bỏ qua hoàn toàn lệnh sinh key jks thủ công để hệ thống tự cấp khóa debug chuẩn của Google)
    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-configuration-cache -x test -x lint -x checkDebugAarMetadata --stacktrace

    # Bước 4: Thu gom file APK ĐÃ ĐƯỢC KÝ XỊN TỰ ĐỘNG đưa lên màn hình cho bạn tải về máy tính
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: |
          **/build/outputs/apk/debug/*.apk
