name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo Java 21 chuẩn
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Bước 2: Nâng cấp kịch trần lên Gradle 9.3.1 đúng theo yêu cầu hệ thống
    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Bước 3: Đóng gói file debug APK trực tiếp từ thư mục gốc
    - name: Build Debug APK
      run: gradle assembleDebug --no-configuration-cache --stacktrace

    # Bước 4: ĐÃ SỬA: Quét sâu đa tầng thư mục để gom chính xác file APK găm lên màn hình
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: |
          app/app/build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
