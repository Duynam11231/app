name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Nâng cấp lên Java 21 bắt buộc để chạy được Android Plugin 9.x
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Bước 2: Nâng cấp kịch trần lên Gradle 8.10.2 để tương thích hoàn toàn với bản 9.1.1
    - name: Setup Gradle 8.10.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    # Bước 3: Tạo tệp gradlew thực thi đồng bộ
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      working-directory: app

    # Bước 4: Khóa quyền bảo mật hệ thống cho tệp vừa sinh ra
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: app

    # Bước 5: Tiến hành đóng gói file APK thành phẩm
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      working-directory: app

    # Bước 6: Xuất file APK ra ngoài màn hình để tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/app/build/outputs/apk/debug/app-debug.apk
