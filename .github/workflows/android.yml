name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo môi trường Java 17 chuẩn để chạy mượt bản Gradle 8.x
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Bước 2: Hạ xuống Gradle 8.10.2 ổn định nhất để trị triệt để lỗi nghẽn mạch KSP
    - name: Setup Gradle 8.10.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    # Bước 3: Tạo file khóa cứng vật lý (.jks) trực tiếp tại phân vùng gốc
    - name: Generate Key Store File
      run: |
        keytool -genkey -v -keystore my-debug-key.jks -storepass androiddebug -alias androiddebugkey -keypass androiddebug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Bước 4: Đóng gói ứng dụng chính thức (Bỏ hoàn toàn các tính năng cache gây xung đột)
    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-daemon --no-configuration-cache -x test -x lint --stacktrace

    # Bước 5: Gom file APK ĐÃ ĐƯỢC KÝ XỊN găm lên mục tóm tắt cho bạn tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: |
          **/build/outputs/apk/debug/*.apk
