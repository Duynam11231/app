name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo Java 21 chuẩn
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Bước 2: Khởi tạo Gradle 9.3.1 đồng bộ kịch trần
    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Bước 3: MẸO CỨU HỘ: Tự động tạo file khóa debug.keystore ảo để vượt lỗi validateSigningDebug
    - name: Create Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Bước 4: Đóng gói file APK hoàn chỉnh
    - name: Build Debug APK
      run: gradle assembleDebug --no-configuration-cache --stacktrace

    # Bước 5: Xuất file APK thành phẩm ra ngoài màn hình để tải về máy tính
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/build/outputs/apk/debug/app-debug.apk
