name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 1: Khởi tạo môi trường Java 21 chuẩn để gõ lệnh Gradle 9.x
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # Bước 2: Nâng cấp kịch trần lên Gradle 9.3.1 để tương thích hoàn toàn với bản Plugin 9.1.1
    - name: Setup Gradle 9.3.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Bước 3: Tạo file khóa cứng vật lý (.jks) trực tiếp tại phân vùng gốc
    - name: Generate Key Store File
      run: |
        keytool -genkey -v -keystore my-debug-key.jks -storepass androiddebug -alias androiddebugkey -keypass androiddebug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    # Bước 4: Đóng gói ứng dụng chính thức (Bọc thêm cờ lệnh ngắt cache --no-configuration-cache để xóa lỗi sập KSP)
    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-configuration-cache -x test -x lint --stacktrace

    # Bước 5: Gom file APK ĐÃ ĐƯỢC KÝ XỊN găm lên mục tóm tắt cho bạn tải về
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: |
          **/build/outputs/apk/debug/*.apk
