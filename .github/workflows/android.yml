name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Cài đặt Java 17 chuẩn
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # ĐOẠN CODE QUAN TRỌNG: Tự động tải và sinh tệp gradlew bị thiếu vào thư mục app
    - name: Generate Gradle Wrapper
      run: gradle wrapper
      working-directory: app

    # Cấp quyền thực thi hệ thống cho tệp vừa sinh ra
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: app

    # Tiến hành đóng gói file APK thành phẩm
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      working-directory: app

    # Xuất file APK ra màn hình để tải về máy tính
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/app/build/outputs/apk/debug/app-debug.apk
