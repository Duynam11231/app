name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Đổi sang dùng Java 17 chuẩn để tương thích với tệp cấu hình kts của Gemini
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # Sửa quyền thực thi bắt buộc cho tệp tin chạy nền
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: app

    # Ép máy chủ gọi lệnh build chuyên dụng cho cấu trúc build.gradle.kts
    - name: Build Debug APK with Kotlin DSL
      run: ./gradlew :app:assembleDebug --stacktrace
      working-directory: app

    # Xuất sản phẩm file APK ra màn hình để tải về máy tính
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SieuDongBangAPK
        path: app/app/build/outputs/apk/debug/app-debug.apk
